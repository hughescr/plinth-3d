[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "geom_kernel"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]

[tool.maturin]
# Mixed Rust/Python layout (spec sec 1.1 Amendment A20): the Python package
# root lives under python/geom_kernel, the compiled extension is injected as
# geom_kernel._native.
python-source = "python"
module-name = "geom_kernel._native"
features = ["pyo3/extension-module", "python"]
