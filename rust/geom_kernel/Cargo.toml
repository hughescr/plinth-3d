[package]
name = "geom_kernel"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
build = "build.rs"

[lib]
name = "geom_kernel"
# cdylib: the PyO3 extension module. rlib: so `cargo test` can link the crate.
crate-type = ["cdylib", "rlib"]

[dependencies]
# rust-numpy is selected FIRST (spec sec 1.2 Amendment A20) and its required
# pyo3 version drives the top-level pyo3 pin. numpy 0.23 -> pyo3 0.23; matches
# the numpy 2.x runtime ABI (venv numpy 2.2.6).
numpy = "0.23"
rayon = "1.10"

# extension-module is NOT hardcoded here: it disables libpython linking, which
# would break `cargo test`'s test binary. maturin passes pyo3/extension-module
# at build time (see pyproject.toml [tool.maturin] features). `cargo test` links
# libpython (needs PYO3_PYTHON pointing at the venv python).
[dependencies.pyo3]
version = "0.23"
features = ["abi3-py311"]

[profile.release]
lto = "thin"
# default codegen-units; no target-cpu=native, no fast-math (spec sec 1.2/5.1).

# opt-level 2 + debug assertions for kernel debugging (spec sec 1.2).
[profile.dev-opt]
inherits = "dev"
opt-level = 2
debug-assertions = true
