[package]
name = "chitubox_io"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
description = "Read/write ChituBox Basic .chitubox project files: add STL models, attach support records, set placement. Pure Rust, wrapper-friendly, batch-first."
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "chitubox_io"
# Plain rlib. The crate once also built as a `cdylib` so maturin could package
# it as the `chitubox_io._native` PyO3 extension module; that binding was
# deleted on 2026-08-08 (E8, Python elimination) and every consumer is now a
# Rust crate linking this by path, so the cdylib is gone with it.

[dependencies]
thiserror = "1"

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"

[features]
default = []
