[workspace]
members = ["crates/*", "rust/chitubox_io", "rust/geom_kernel"]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
cxx = "=1.0.198"
cxx-build = "=1.0.198"
rayon = "1.10"
robust = "1.2"
meshopt = "=0.6.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

# Workspace-wide build profiles.  These were previously (and ineffectively)
# declared in legacy member manifests; preserve their exact intent here.
[profile.test]
opt-level = 2

[profile.release]
# Default codegen units; no target-cpu=native or fast-math.
lto = "thin"

[profile.dev-opt]
inherits = "dev"
opt-level = 2
debug-assertions = true
