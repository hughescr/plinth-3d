[workspace]
members = ["crates/*", "rust/chitubox_io", "rust/geom_kernel"]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
cxx = "=1.0.198"
cxx-build = "=1.0.198"
i_overlay = "=8.0.0"
kiddo = { version = "=5.3.3", default-features = false }
rayon = "1.10"
robust = "1.2"
meshopt = "=0.6.2"
rand_chacha = "=0.10.0"
rand_core = "=0.10.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

# Workspace-wide build profiles.  These were previously (and ineffectively)
# declared in legacy member manifests; preserve their exact intent here.
[profile.test]
opt-level = 2

[profile.release]
# Default codegen units; no target-cpu=native or fast-math.
lto = "thin"

[profile.dev-opt]
inherits = "dev"
opt-level = 2
debug-assertions = true

# Cheap-but-honest test gate: release SEMANTICS (debug-assertions off,
# overflow-checks matching release) at a much cheaper compile cost.
# Used by lane gates; the merge gate to develop stays full --release.
# Note: `lto` and `incremental` are top-level-only profile keys and cannot
# be overridden per package, so dependency crates cannot be pinned to reuse
# release's cached artifacts here — the `lto = "off"` vs release's
# `lto = "thin"` setting alone changes the rustc invocation (embed-bitcode)
# for every crate in the graph, including dependencies. Dependencies rebuild
# once into target/gate, then stay warm for subsequent gate builds.
[profile.gate]
inherits = "release"
incremental = true
lto = "off"
codegen-units = 16
opt-level = 2
