[workspace]
resolver = "3"
members = ["crates/*"]
# The checker is a separate program with its own workspace, lockfile and build folder
# (design dev-loop.md section 4.4). tools/devloop is the loop runner's own workspace.
exclude = ["checker", "tools/devloop"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
plinth-geom = { path = "crates/geom" }
plinth-chitubox = { path = "crates/chitubox" }
plinth-support = { path = "crates/support" }
plinth-emit = { path = "crates/emit" }
plinth-cli = { path = "crates/cli" }
proptest = { version = "1.12.0", default-features = true }
lexopt = "0.3.1"
# Safe getrusage wrapper, used only by plinth-cli's mem module (unsafe_code stays forbid).
nix = { version = "0.31.3", default-features = false, features = ["resource"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
float_cmp = "deny"
too_many_lines = "deny"

# The inner-loop profile: plain cargo build / cargo test / nextest use it.
[profile.dev]
opt-level = 2 # measured: same rebuild cost as opt 1, code 2.4x faster (design M3, M5, M10)
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = true
codegen-units = 256
debug-assertions = true
overflow-checks = true
lto = false

# Registry dependencies only: built once per slot.
[profile.dev.package."*"]
opt-level = 3
debug = false

# Build scripts and proc macros: compile fast.
[profile.dev.build-override]
opt-level = 0
debug = false

# L5 timing and owner-facing binaries; bench slot only.
[profile.release]
opt-level = 3
debug = "line-tables-only"
split-debuginfo = "unpacked"
codegen-units = 16
incremental = false
lto = false
overflow-checks = true
