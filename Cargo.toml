[workspace]
members = ["crates/*", "rust/chitubox_io", "rust/geom_kernel"]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
cxx = "=1.0.198"
cxx-build = "=1.0.198"
i_overlay = "=8.0.0"
kiddo = { version = "=5.3.3", default-features = false }
rayon = "1.10"
robust = "1.2"
meshopt = "=0.6.2"
rand_chacha = "=0.10.0"
rand_core = "=0.10.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

# Workspace-wide build profiles.  These were previously (and ineffectively)
# declared in legacy member manifests; preserve their exact intent here.
[profile.test]
opt-level = 2

[profile.release]
# Default codegen units; no target-cpu=native or fast-math.
lto = "thin"

[profile.dev-opt]
inherits = "dev"
opt-level = 2
debug-assertions = true

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
# Real signal: keep strict_comparison, cast_possible_truncation,
# cast_sign_loss, cast_possible_wrap, cast_precision_loss, and
# suspicious_operation_groupings at "warn" (inherited from pedantic/nursery
# above); everything below is style noise this project should not carry.
suboptimal_flops = "allow"
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
items_after_statements = "allow"
unreadable_literal = "allow"
redundant_closure_for_method_calls = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
many_single_char_names = "allow"
redundant_pub_crate = "allow"
doc_lazy_continuation = "allow"
too_many_lines = "allow"
missing_fields_in_debug = "allow"
struct_field_names = "allow"
must_use_candidate = "allow"
# Manual-midpoint is real but zero-risk on mm-scale f64; leave at warn as a
# free cleanup queue, don't allow it away.
#
# The block above is the census-drafted list. Running it against the live
# workspace surfaced ~990 more warnings across 27 additional pedantic/nursery
# idiom lints the census never sampled (nursery's lint set is unstable and
# grows between clippy releases). Every one read is a style/idiom preference
# with no correctness content — sampled at least one site per lint below and
# confirmed none touches the risk classes the census flagged (strict
# comparison, casts, suspicious operator groupings). Allowed for the same
# reason as the block above: noise, not signal.
missing_const_for_fn = "allow"
too_long_first_doc_paragraph = "allow"
use_self = "allow"
cast_lossless = "allow"
derive_partial_eq_without_eq = "allow"
format_push_string = "allow"
option_if_let_else = "allow"
map_unwrap_or = "allow"
single_match_else = "allow"
manual_let_else = "allow"
match_same_arms = "allow"
elidable_lifetime_names = "allow"
or_fun_call = "allow"
if_not_else = "allow"
tuple_array_conversions = "allow"
used_underscore_items = "allow"
unnecessary_wraps = "allow"
wildcard_imports = "allow"
uninlined_format_args = "allow"
trivially_copy_pass_by_ref = "allow"
useless_let_if_seq = "allow"
nonminimal_bool = "allow"
large_types_passed_by_value = "allow"
struct_excessive_bools = "allow"
semicolon_if_nothing_returned = "allow"
return_self_not_must_use = "allow"
ignored_unit_patterns = "allow"
bool_to_int_with_if = "allow"
# debug_assert_with_mut_call stays at warn (nursery default): calling a
# mutating expression inside debug_assert! means the mutation silently
# vanishes in a release build — a real debug/release behaviour split, not
# style. Only 2 sites (brace.rs:1634, specialized.rs:6339); worth a look.

# Third pass, after the two blocks above: `cargo clippy --workspace
# --all-targets` still surfaced ~51 warnings across 24 more pedantic/nursery
# lints neither prior pass sampled (same unstable-nursery-lint-set cause).
# Read every site; all are style/idiom preferences on already-safe code
# (a const-array-of-descriptors macro, a Vec::drain, a while loop with an
# epsilon-guarded float bound, an unused &mut self param, etc.) — none
# touches the risk classes this file deliberately keeps at warn (strict
# float comparison, the cast_* family, suspicious_operation_groupings,
# needless_pass_by_value, redundant_clone, manual_midpoint,
# debug_assert_with_mut_call). Allowed for the same reason as the blocks
# above: noise, not signal.
assigning_clones = "allow"
borrow_as_ptr = "allow"
case_sensitive_file_extension_comparisons = "allow"
cloned_instead_of_copied = "allow"
copy_iterator = "allow"
duration_suboptimal_units = "allow"
fn_params_excessive_bools = "allow"
imprecise_flops = "allow"
iter_on_single_items = "allow"
iter_with_drain = "allow"
large_stack_arrays = "allow"
manual_is_variant_and = "allow"
match_wild_err_arm = "allow"
needless_collect = "allow"
needless_pass_by_ref_mut = "allow"
needless_raw_string_hashes = "allow"
option_option = "allow"
range_plus_one = "allow"
stable_sort_primitive = "allow"
unnecessary_debug_formatting = "allow"
unnecessary_semicolon = "allow"
unnested_or_patterns = "allow"
unused_self = "allow"
while_float = "allow"

# Cheap-but-honest test gate: release SEMANTICS (debug-assertions off,
# overflow-checks matching release) at a much cheaper compile cost.
# Used by lane gates; the merge gate to develop stays full --release.
# Note: `lto` and `incremental` are top-level-only profile keys and cannot
# be overridden per package, so dependency crates cannot be pinned to reuse
# release's cached artifacts here — the `lto = "off"` vs release's
# `lto = "thin"` setting alone changes the rustc invocation (embed-bitcode)
# for every crate in the graph, including dependencies. Dependencies rebuild
# once into target/gate, then stay warm for subsequent gate builds.
[profile.gate]
inherits = "release"
incremental = true
lto = "off"
codegen-units = 16
opt-level = 2
