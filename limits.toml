# Hard limits (PRD section 6). Data, not code: the generator and the checker each parse
# this file with their own code. The checker prints the values it used in every report,
# and a checker test pins them to the PRD values.
[limits]
h1_patch_area_mm2 = 0.50      # H1: largest contact patch
h4_lift_mm = 5.0              # H4: lowest model point above the plate, minimum
h6_gap_mm = 0.3               # H6: gap from the model outside a contact-surrounding region
h9_thickness_mm = 0.1         # H9: thinnest support part
region_length_mm = 3.0        # contact-surrounding region, longest distance from contact centre
