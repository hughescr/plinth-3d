[package]
name = "plinth-pipeline"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
publish = false

[dependencies]
plinth-core = { path = "../plinth-core" }
plinth-decimate = { path = "../plinth-decimate" }
plinth-emit = { path = "../plinth-emit" }
plinth-hollow = { path = "../plinth-hollow" }
plinth-orient = { path = "../plinth-orient" }
plinth-support = { path = "../plinth-support" }
plinth-verify = { path = "../plinth-verify" }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# The E2 first-artifact seam re-reads what it wrote, and chitubox_io parses the
# emitted container back. That is example/test-only. plinth-verify is a real
# dependency above, not a dev one: the pre-write gate consults its coverage
# verdict before the library ever calls plinth-emit.
chitubox_io = { path = "../../rust/chitubox_io" }
plinth-mesh = { path = "../plinth-mesh" }
serde_json = { workspace = true }
