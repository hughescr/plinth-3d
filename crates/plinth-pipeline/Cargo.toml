[package]
name = "plinth-pipeline"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
# The vec3 algebra alone, for the volume of a solid the run emits in place of
# the shell it set out to make (the not-hollowed warning). No cycle: geom_kernel
# depends on no `plinth-*` crate.
geom_kernel = { path = "../../rust/geom_kernel" }
plinth-core = { path = "../plinth-core" }
plinth-decimate = { path = "../plinth-decimate" }
plinth-emit = { path = "../plinth-emit" }
plinth-hollow = { path = "../plinth-hollow" }
plinth-mesh = { path = "../plinth-mesh" }
plinth-orient = { path = "../plinth-orient" }
plinth-support = { path = "../plinth-support" }
# LANE 2: the slice-sweep placement selector. A RUNTIME enum on the request,
# not a Cargo feature, so both engines live in one binary and can be measured
# side by side on the same build.
plinth-sweep = { path = "../plinth-sweep" }
plinth-verify = { path = "../plinth-verify" }
serde = { workspace = true }
# FU-57: the coverage-refusal sidecar is production output, written on the
# refusal path of every `plinth prepare` run -- not a test/example-only
# concern -- so this moves out of dev-dependencies. The embedded `report`/
# `closure` field is the refusing `CoverageReport` or `CoverageClosureRefusal`
# serialized verbatim via `serde_json::to_value`, which is how the sidecar can
# promise a lossless round trip without a second, hand-maintained format.
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# The E2 first-artifact seam re-reads what it wrote, and chitubox_io parses the
# emitted container back. That is example/test-only. plinth-verify and
# plinth-mesh are real dependencies above, not dev ones: the pre-write gate
# consults plinth-verify's coverage verdict before the library ever calls
# plinth-emit, and `prepare` loads every source model through plinth-mesh.
chitubox_io = { path = "../../rust/chitubox_io" }
# `tests/deferred_diagnostics_output.rs` fails the decimation diagnostics on
# purpose; the injection hook exists only with this feature, which only
# test builds of this crate turn on.
plinth-decimate = { path = "../plinth-decimate", features = ["fault-injection"] }
# The same for orientation: `tests/deferred_diagnostics_output.rs` fails the
# orientation after its search to prove the search's `orient.json` survives.
plinth-orient = { path = "../plinth-orient", features = ["fault-injection"] }

# `tests/it/orient_as_drawn.rs` sets `user.xdg.tags` on a scratch file.
[target.'cfg(target_os = "linux")'.dev-dependencies]
xattr = "1.6"
