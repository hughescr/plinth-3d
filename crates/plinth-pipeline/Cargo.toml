[package]
name = "plinth-pipeline"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
plinth-core = { path = "../plinth-core" }
plinth-decimate = { path = "../plinth-decimate" }
plinth-emit = { path = "../plinth-emit" }
plinth-hollow = { path = "../plinth-hollow" }
plinth-mesh = { path = "../plinth-mesh" }
plinth-orient = { path = "../plinth-orient" }
plinth-support = { path = "../plinth-support" }
plinth-verify = { path = "../plinth-verify" }
serde = { workspace = true }
# FU-57: the coverage-refusal sidecar is production output, written on the
# refusal path of every `plinth prepare` run -- not a test/example-only
# concern -- so this moves out of dev-dependencies. The embedded `report`/
# `closure` field is the refusing `CoverageReport` or `CoverageClosureRefusal`
# serialized verbatim via `serde_json::to_value`, which is how the sidecar can
# promise a lossless round trip without a second, hand-maintained format.
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# The E2 first-artifact seam re-reads what it wrote, and chitubox_io parses the
# emitted container back. That is example/test-only. plinth-verify and
# plinth-mesh are real dependencies above, not dev ones: the pre-write gate
# consults plinth-verify's coverage verdict before the library ever calls
# plinth-emit, and `prepare` loads every source model through plinth-mesh.
chitubox_io = { path = "../../rust/chitubox_io" }
