[package]
name = "plinth-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[[bin]]
name = "plinth"
path = "src/main.rs"

[dependencies]
# The wall-thickness default is a registered constant, so the parser reads the
# one M0 publication directly rather than restating 2.5 as a CLI literal.
plinth-core = { path = "../plinth-core" }
plinth-hollow = { path = "../plinth-hollow" }
plinth-orient = { path = "../plinth-orient" }
plinth-pipeline = { path = "../plinth-pipeline" }

[dev-dependencies]
# Test-only: the repair evidence the run report renders is a `plinth-mesh`
# type, and the report block's line builder is tested against it directly
# rather than by capturing stdout.
plinth-mesh = { path = "../plinth-mesh" }
# Test-only: the PR-8 contact disclosures have private fields, so a test builds
# one by deserializing it — the same route a frozen run report on disk takes
# back in, which is why the numbers a test asserts are the numbers a reader
# sees.
serde_json = { workspace = true }
