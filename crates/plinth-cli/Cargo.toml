[package]
name = "plinth-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[[bin]]
name = "plinth"
path = "src/main.rs"

[features]
# Opt-in global allocator for the `plinth` binary only (never the library
# crates, so test and library users keep the system allocator).  Measured with
# no wall-time gain over the system allocator (docs/development.md, "Build flags
# and allocator"), so it is not a default; the feature stays so that the
# question can be asked again after the small-allocation sites are fixed.
mimalloc = ["dep:mimalloc"]
# Profiling build: counts allocations and samples their call sites
# (`scripts/alloc-profile.sh`).  Slows the run; never time it.  Choose at most
# one global-allocator feature.
alloc-count = []

[dependencies]
mimalloc = { version = "=0.1.52", default-features = false, optional = true }
# The near-parallel counters the run report prints at end of run
# (`geom_kernel::telemetry`, `docs/specs/geometry-adjudication.md` §O4/§EXT-2).
# This is a REPORTING dependency and nothing else: the CLI reads three atomics
# and prints them, and no `geom_kernel` type crosses into a decision here.  It
# is a direct edge because none of the four crates below depends on or
# re-exports `geom_kernel` -- routing the read through one of them would put a
# telemetry re-export in a crate that has no other reason to carry one.
geom_kernel = { path = "../../rust/geom_kernel" }
# The wall-thickness default is a registered constant, so the parser reads the
# one M0 publication directly rather than restating 2.5 as a CLI literal.
plinth-core = { path = "../plinth-core" }
plinth-hollow = { path = "../plinth-hollow" }
plinth-orient = { path = "../plinth-orient" }
plinth-pipeline = { path = "../plinth-pipeline" }

[dev-dependencies]
# Test-only: the repair evidence the run report renders is a `plinth-mesh`
# type, and the report block's line builder is tested against it directly
# rather than by capturing stdout.
plinth-mesh = { path = "../plinth-mesh" }
# Test-only: the PR-8 contact disclosures have private fields, so a test builds
# one by deserializing it — the same route a frozen run report on disk takes
# back in, which is why the numbers a test asserts are the numbers a reader
# sees.
serde_json = { workspace = true }
