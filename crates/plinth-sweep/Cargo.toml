[package]
name = "plinth-sweep"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
# The registry is the only place a number may come from. Nothing in this crate
# declares a physical constant of its own.
plinth-core = { path = "../plinth-core" }
plinth-mesh = { path = "../plinth-mesh" }
# LANE 3 (docs/plans/slice-sweep-core-2026-09-02.md §12): src/orient_demand.rs
# implements `plinth_orient::demand::SupportDemandMeasurer`, the trait that
# lets the orientation objective's support term read real sweep demand
# without `plinth-orient` depending on this crate (that would cycle back
# through plinth-support -> plinth-hollow -> plinth-orient; see
# `plinth_orient::demand`'s own module doc). Nothing `plinth-orient` depends
# on reaches back here, so this edge introduces no cycle.
plinth-orient = { path = "../plinth-orient" }
# For `plinth_hollow::passage` alone -- the drill stage's own conservative
# voxel EDT and its own `r + pitch/2` clearance rule, so the drain-escape
# check decides "does the bore fit through here" with the same machinery, the
# same threshold and the same registered pitch the drill stage decided the
# identical question with. No cycle: plinth-support (already a dependency
# here) depends on plinth-hollow, and nothing plinth-hollow depends on reaches
# back into this crate.
plinth-hollow = { path = "../plinth-hollow" }
# For `plinth_support::perception::slice_stack` alone -- the stitch/orient/
# normalize chain the print-layer path already runs. No legacy placement code
# is reached from here, and `dyadic::refine_depth`, the per-triangle refinement
# that is root cause RC3, must never be.
plinth-support = { path = "../plinth-support" }
# Item 5 of the 2026-09-03 slice-sweep review follow-ups: the finalist
# production sweeps in `orient_demand.rs` are index-parallel and share no
# mutable state, so they run through the workspace's existing rayon
# dependency (already used by plinth-support, plinth-orient and plinth-layers)
# rather than serially.
rayon = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# tests/round_bases_ratchet.rs drives the real dense orientation search
# (plinth_orient::search_and_orient), which takes a `DecimatedModel`; that
# type, and the `plinth_decimate::run` that builds one, live in
# plinth-decimate. Test-only -- nothing in src/ depends on this -- and it
# introduces no cycle: plinth-pipeline depends on both plinth-sweep and
# plinth-decimate already, but plinth-sweep depending on plinth-pipeline
# itself (even as a dev-dependency) would be one, which is why this test
# duplicates prepare.rs's small `registered_decimation_budget` body instead
# of importing plinth-pipeline. Same pattern as plinth-pipeline's own
# chitubox_io dev-dependency.
plinth-decimate = { path = "../plinth-decimate" }
