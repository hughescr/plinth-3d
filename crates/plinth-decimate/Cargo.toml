[package]
name = "plinth-decimate"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
meshopt = { workspace = true }
geom_kernel = { path = "../../rust/geom_kernel" }
plinth-core = { path = "../plinth-core" }
plinth-mesh = { path = "../plinth-mesh" }
rand_chacha = { workspace = true }
rand_core = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }

[features]
# Test-only. Exposes `injection`, which disturbs a deferred diagnostic job so
# another crate's tests can prove what the pipeline does when one fails. Never
# enabled in a production build (plinth-pipeline turns it on in dev-dependencies).
fault-injection = []

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
