[package]
name = "plinth-emit"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
chitubox_io = { path = "../../rust/chitubox_io" }
geom_kernel = { path = "../../rust/geom_kernel" }
plinth-core = { path = "../plinth-core" }
plinth-mesh = { path = "../plinth-mesh" }
# The seat trim (fix/tip-trim): every seated tip and first shaft segment minus
# the model solid, in one batched Manifold call.
plinth-solid = { path = "../plinth-solid" }
plinth-support = { path = "../plinth-support" }
# Record generation, seat-trim welds and the trim's native batches, record
# encoding: index-parallel map-collect under geom_kernel::par (bytes unchanged).
rayon = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
plinth-decimate = { path = "../plinth-decimate" }
plinth-hollow = { path = "../plinth-hollow" }
plinth-orient = { path = "../plinth-orient" }
