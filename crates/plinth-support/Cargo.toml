[package]
name = "plinth-support"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
publish = false

[dependencies]
geom_kernel = { path = "../../rust/geom_kernel" }
plinth-core = { path = "../plinth-core" }
plinth-hollow = { path = "../plinth-hollow" }
plinth-mesh = { path = "../plinth-mesh" }
rayon = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
plinth-decimate = { path = "../plinth-decimate" }
plinth-orient = { path = "../plinth-orient" }
serde_json = { workspace = true }
syn = { version = "2", features = ["full", "visit"] }
trybuild = "1"
