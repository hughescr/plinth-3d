[package]
name = "plinth-support"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[features]
# Throwaway 2026-08-04 embed-incidence census instrumentation, quarantined so it
# cannot reach a production build (MAJOR-8). Off by default; the census example
# below requires it. Enable with `--features census`.
census = []

[dependencies]
geom_kernel = { path = "../../rust/geom_kernel" }
plinth-core = { path = "../plinth-core" }
plinth-hollow = { path = "../plinth-hollow" }
plinth-layers = { path = "../plinth-layers" }
plinth-mesh = { path = "../plinth-mesh" }
rayon = { workspace = true }
serde = { workspace = true }
# The live trial trail (coverage_repair::RepairTrialTrail) writes one JSON step
# row per trial as the repair search runs, in the same wire shape the sealed
# sidecar carries, so a killed run leaves a stream the same `jq` can read.
# Every other crate in this workspace already depends on it, so this adds no
# external crate to the build graph.
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# testkit feature: crate::seat_zone's unit tests use geom_kernel::testkit;
# this dev-only re-declaration turns the feature on for test/bench builds
# without enabling it for the normal [dependencies] entry above.
geom_kernel = { path = "../../rust/geom_kernel", features = ["testkit"] }
plinth-decimate = { path = "../plinth-decimate" }
plinth-orient = { path = "../plinth-orient" }
serde_json = { workspace = true }
trybuild = "1"

[[example]]
name = "embed_incidence_census"
required-features = ["census"]
