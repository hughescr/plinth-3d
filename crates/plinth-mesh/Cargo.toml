[package]
name = "plinth-mesh"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
# The shared, batch-first geometry kernel (owner override O-5: one spatial
# implementation).  The delicacy evaluator's thinness proxy needs a batched ray
# cast; it does not get its own BVH.
geom_kernel = { path = "../../rust/geom_kernel" }
plinth-core = { path = "../plinth-core" }
robust = { workspace = true }
# The curvature spread and the display neighbourhood pass run as index-parallel
# map-collect inside `geom_kernel::run_in_pool` (never rayon's global pool);
# see `surface_par.rs`.
rayon = { workspace = true }
# The repair pre-pass's per-action evidence travels into the `plinth prepare`
# run report, which is serialized. The evidence type is owned here, beside the
# code that produces it, rather than copied into a report-side DTO that could
# drift from it.
serde = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }

[features]
# Exposes the frozen serial bodies of the curvature spread and the display
# neighbourhood pass (`surface_oracle`), for `examples/surface_field_witness.rs`.
# Never enabled in a production build.
serial-oracle = []

[[example]]
name = "surface_field_witness"
required-features = ["serial-oracle"]

[dev-dependencies]
serde_json = { workspace = true }
