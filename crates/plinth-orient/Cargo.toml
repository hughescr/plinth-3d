[package]
name = "plinth-orient"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
publish = false

[lints]
workspace = true

[dependencies]
# The shared kernel is depended on for two things: `run_in_pool`, the single
# `PLINTH_THREADS` pool authority every crate's batch calls share
# (06-conventions §3), and `geom_kernel::vec3` for this crate's dot/cross/norm
# arithmetic (docs/specs/geometry-canon.md §1 OP-6/OP-7/OP-9, geometry
# consolidation sweep). No spatial query in this crate goes anywhere else, and
# there is no second BVH here (O-5).
geom_kernel = { path = "../../rust/geom_kernel" }
plinth-core = { path = "../plinth-core" }
plinth-decimate = { path = "../plinth-decimate" }
plinth-mesh = { path = "../plinth-mesh" }
rayon = { workspace = true }
serde = { workspace = true }
# The record is content-addressed the way every other artifact in this workspace
# is: SHA-256 over a canonical serialization. Both crates are already in the
# frozen lockfile (plinth-mesh hashes meshes with sha2; the pipeline serializes
# reports with serde_json), so this adds no external crate.
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
# The "use this model as drawn" tags (GitHub issue #1, owner spec 2026-10-01):
# read a file's extended attributes directly, never through Spotlight.
# MIT OR Apache-2.0. Its default `unsupported` feature makes it compile, and
# report "not supported", on a platform without xattrs, so a build there reads
# no tag rather than failing.
xattr = "1.6"

# macOS Finder tags live in `com.apple.metadata:_kMDItemUserTags` as a binary
# plist array of strings. MIT. Only macOS writes that attribute, so only macOS
# links the decoder; serde support is not needed.
[target.'cfg(target_os = "macos")'.dependencies]
plist = { version = "1.10", default-features = false }
