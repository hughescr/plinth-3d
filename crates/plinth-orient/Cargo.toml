[package]
name = "plinth-orient"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
publish = false

[dependencies]
# The shared kernel is depended on for exactly one thing: `current_threads`,
# the single `PLINTH_THREADS` pool authority every crate's batch calls share
# (06-conventions §3).  No spatial query in this crate goes anywhere else, and
# there is no second BVH here (O-5).
geom_kernel = { path = "../../rust/geom_kernel" }
plinth-core = { path = "../plinth-core" }
plinth-decimate = { path = "../plinth-decimate" }
plinth-mesh = { path = "../plinth-mesh" }
rayon = { workspace = true }
serde = { workspace = true }
# The record is content-addressed the way every other artifact in this workspace
# is: SHA-256 over a canonical serialization. Both crates are already in the
# frozen lockfile (plinth-mesh hashes meshes with sha2; the pipeline serializes
# reports with serde_json), so this adds no external crate.
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
